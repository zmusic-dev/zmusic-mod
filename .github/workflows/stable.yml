      - name: Download Release Notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: release-notes
      - name: Dry-run CurseForge and Modrinth
        env:
          MOD_LOADER: ${{ matrix.mod-loader }}
          MC_VERSION: ${{ matrix.target-version }}
          MC_VERSIONS: ${{ matrix.supported-versions }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_NAME: ZMusic ${{ github.ref_name }} ${{ matrix.loader }} ${{ matrix.target-version }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          DRY_RUN: true
        run: |
          FILE_PATH="$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          if [ -z "$FILE_PATH" ]; then
            echo "No jar found in artifact" >&2
            find artifact -maxdepth 2 -type f -print >&2
            exit 1
          fi
          FILE_PATH="$(realpath "$FILE_PATH")"
          CHANGELOG="$(cat release-notes/release-notes.md)" \
            FILE_PATH="$FILE_PATH" \
            ./gradlew --project-dir builds/publish publishMarketplaceFile --no-daemon

