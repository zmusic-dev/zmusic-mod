name: Stable Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ZMusic ${{ matrix.loader }} ${{ matrix.mc-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-26.1.2
            mc-version: 26.1.2
            artifact-path: zmusic-fabric/zmusic-fabric-26.1.2/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.21.11
            mc-version: 1.21.11
            artifact-path: zmusic-fabric/zmusic-fabric-1.21.11/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.21.5
            mc-version: 1.21.5
            artifact-path: zmusic-fabric/zmusic-fabric-1.21.5/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.20.6
            mc-version: 1.20.6
            artifact-path: zmusic-fabric/zmusic-fabric-1.20.6/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.20.4
            mc-version: 1.20.4
            artifact-path: zmusic-fabric/zmusic-fabric-1.20.4/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.20.1
            mc-version: 1.20.1
            artifact-path: zmusic-fabric/zmusic-fabric-1.20.1/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.19.4
            mc-version: 1.19.4
            artifact-path: zmusic-fabric/zmusic-fabric-1.19.4/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.19.2
            mc-version: 1.19.2
            artifact-path: zmusic-fabric/zmusic-fabric-1.19.2/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.18.2
            mc-version: 1.18.2
            artifact-path: zmusic-fabric/zmusic-fabric-1.18.2/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.17.1
            mc-version: 1.17.1
            artifact-path: zmusic-fabric/zmusic-fabric-1.17.1/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.16.5
            mc-version: 1.16.5
            artifact-path: zmusic-fabric/zmusic-fabric-1.16.5/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.15.2
            mc-version: 1.15.2
            artifact-path: zmusic-fabric/zmusic-fabric-1.15.2/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.14.4
            mc-version: 1.14.4
            artifact-path: zmusic-fabric/zmusic-fabric-1.14.4/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.20.4
            mc-version: 1.20.4
            artifact-path: zmusic-forge/zmusic-forge-1.20.4/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.20.1
            mc-version: 1.20.1
            artifact-path: zmusic-forge/zmusic-forge-1.20.1/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.19.4
            mc-version: 1.19.4
            artifact-path: zmusic-forge/zmusic-forge-1.19.4/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.19.2
            mc-version: 1.19.2
            artifact-path: zmusic-forge/zmusic-forge-1.19.2/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.18.2
            mc-version: 1.18.2
            artifact-path: zmusic-forge/zmusic-forge-1.18.2/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.17.1
            mc-version: 1.17.1
            artifact-path: zmusic-forge/zmusic-forge-1.17.1/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.16.5
            mc-version: 1.16.5
            artifact-path: zmusic-forge/zmusic-forge-1.16.5/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.15.2
            mc-version: 1.15.2
            artifact-path: zmusic-forge/zmusic-forge-1.15.2/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.14.4
            mc-version: 1.14.4
            artifact-path: zmusic-forge/zmusic-forge-1.14.4/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.12.2
            mc-version: 1.12.2
            artifact-path: zmusic-forge/zmusic-forge-1.12.2/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: zmusic-neoforge-26.1.2
            mc-version: 26.1.2
            artifact-path: zmusic-neoforge/zmusic-neoforge-26.1.2/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: zmusic-neoforge-1.21.1
            mc-version: 1.21.1
            artifact-path: zmusic-neoforge/zmusic-neoforge-1.21.1/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: zmusic-neoforge-1.20.6
            mc-version: 1.20.6
            artifact-path: zmusic-neoforge/zmusic-neoforge-1.20.6/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: zmusic-neoforge-1.20.4
            mc-version: 1.20.4
            artifact-path: zmusic-neoforge/zmusic-neoforge-1.20.4/build/libs/**.jar
    steps:
      - uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/zmusic-player
          key: ${{ runner.os }}-gradle-${{ matrix.project }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.project }}-
            ${{ runner.os }}-gradle-
      - name: Build ${{ matrix.loader }} ${{ matrix.mc-version }}
        run: |
          ./gradlew --project-dir "${{ matrix.build-dir }}" ":${{ matrix.project }}:build" --no-daemon \
            -Pzmusic.project="${{ matrix.project }}" \
            -Porg.gradle.java.installations.paths="$(mise where java@temurin-8),$(mise where java@temurin-16),$(mise where java@temurin-17),$(mise where java@temurin-21),$(mise where java@temurin-25)"
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZMusic ${{ matrix.loader }} ${{ matrix.mc-version }}
          path: ${{ matrix.artifact-path }}

  release:
    name: Publish stable release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*.jar
      - name: Publish to CurseForge and Modrinth
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: ZMusic ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          files: artifacts/**/*.jar
          loaders: |
            fabric
            forge
            neoforge
          game-versions: |
            1.12.2
            1.14.4
            1.15.2
            1.16.5
            1.17.1
            1.18.2
            1.19.2
            1.19.4
            1.20.1
            1.20.4
            1.20.6
            1.21.1
            1.21.5
            1.21.11
            26.1.2
          version-type: release
          retry-attempts: 3
      - name: Sync Release to Codeberg and CNB
        env:
          SOURCE_RELEASE_ID: ${{ steps.release.outputs.id }}
          GITHUB_TOKEN: ${{ github.token }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CODEBERG_REPO: zmusic-dev/zmusic-mod
          CNB_REPO: zmusic-dev/zmusic-mod
        run: bash scripts/sync-release.sh
