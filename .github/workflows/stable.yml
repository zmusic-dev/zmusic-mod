name: Stable Build

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Validate builds and marketplace metadata without creating releases or publishing files
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  changelog:
    name: Extract release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Extract release notes
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            scripts/extract-changelog.sh "${GITHUB_REF_NAME}" > release-notes.md
          else
            latest_tag="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
            {
              printf 'Dry-run release notes for `%s`.\n\n' "${GITHUB_REF_NAME}"
              printf 'No tag was provided, so this dry-run uses commit subjects after the latest tag.\n\n'
              if [ -n "$latest_tag" ]; then
                git log --pretty='- %s' "${latest_tag}..HEAD"
              else
                git log --pretty='- %s'
              fi
            } > release-notes.md
          fi

          if [ ! -s release-notes.md ]; then
            echo "release notes are empty" >&2
            exit 1
          fi

          cat release-notes.md
      - name: Upload Release Notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: ZMusic ${{ matrix.loader }} ${{ matrix.target-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-26.1.2
            target-version: 26.1.2
            artifact-path: zmusic-fabric/zmusic-fabric-26.1.2/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.21.11
            target-version: 1.21.11
            artifact-path: zmusic-fabric/zmusic-fabric-1.21.11/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.21.5
            target-version: 1.21.5
            artifact-path: zmusic-fabric/zmusic-fabric-1.21.5/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.20.6
            target-version: 1.20.6
            artifact-path: zmusic-fabric/zmusic-fabric-1.20.6/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.20.4
            target-version: 1.20.4
            artifact-path: zmusic-fabric/zmusic-fabric-1.20.4/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.20.1
            target-version: 1.20.1
            artifact-path: zmusic-fabric/zmusic-fabric-1.20.1/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.19.4
            target-version: 1.19.4
            artifact-path: zmusic-fabric/zmusic-fabric-1.19.4/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.19.2
            target-version: 1.19.2
            artifact-path: zmusic-fabric/zmusic-fabric-1.19.2/build/libs/**.jar
          - loader: Fabric
