name: Stable Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ZMusic ${{ matrix.loader }} ${{ matrix.mc-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-26.1.2
            mc-version: 26.1.2
            artifact-path: zmusic-fabric/zmusic-fabric-26.1.2/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.21.11
            mc-version: 1.21.11
            artifact-path: zmusic-fabric/zmusic-fabric-1.21.11/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.21.5
            mc-version: 1.21.5
            artifact-path: zmusic-fabric/zmusic-fabric-1.21.5/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.20.6
            mc-version: 1.20.6
            artifact-path: zmusic-fabric/zmusic-fabric-1.20.6/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.20.4
            mc-version: 1.20.4
            artifact-path: zmusic-fabric/zmusic-fabric-1.20.4/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.20.1
            mc-version: 1.20.1
            artifact-path: zmusic-fabric/zmusic-fabric-1.20.1/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.19.4
            mc-version: 1.19.4
            artifact-path: zmusic-fabric/zmusic-fabric-1.19.4/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.19.2
            mc-version: 1.19.2
            artifact-path: zmusic-fabric/zmusic-fabric-1.19.2/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.18.2
            mc-version: 1.18.2
            artifact-path: zmusic-fabric/zmusic-fabric-1.18.2/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.17.1
            mc-version: 1.17.1
            artifact-path: zmusic-fabric/zmusic-fabric-1.17.1/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.16.5
            mc-version: 1.16.5
            artifact-path: zmusic-fabric/zmusic-fabric-1.16.5/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.15.2
            mc-version: 1.15.2
            artifact-path: zmusic-fabric/zmusic-fabric-1.15.2/build/libs/**.jar
          - loader: Fabric
            build-dir: builds/fabric
            project: zmusic-fabric-1.14.4
            mc-version: 1.14.4
            artifact-path: zmusic-fabric/zmusic-fabric-1.14.4/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.20.4
            mc-version: 1.20.4
            artifact-path: zmusic-forge/zmusic-forge-1.20.4/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.20.1
            mc-version: 1.20.1
            artifact-path: zmusic-forge/zmusic-forge-1.20.1/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.19.4
            mc-version: 1.19.4
            artifact-path: zmusic-forge/zmusic-forge-1.19.4/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.19.2
            mc-version: 1.19.2
            artifact-path: zmusic-forge/zmusic-forge-1.19.2/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.18.2
            mc-version: 1.18.2
            artifact-path: zmusic-forge/zmusic-forge-1.18.2/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.17.1
            mc-version: 1.17.1
            artifact-path: zmusic-forge/zmusic-forge-1.17.1/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.16.5
            mc-version: 1.16.5
            artifact-path: zmusic-forge/zmusic-forge-1.16.5/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.15.2
            mc-version: 1.15.2
            artifact-path: zmusic-forge/zmusic-forge-1.15.2/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.14.4
            mc-version: 1.14.4
            artifact-path: zmusic-forge/zmusic-forge-1.14.4/build/libs/**.jar
          - loader: Forge
            build-dir: builds/forge
            project: zmusic-forge-1.12.2
            mc-version: 1.12.2
            artifact-path: zmusic-forge/zmusic-forge-1.12.2/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: zmusic-neoforge-26.1.2
            mc-version: 26.1.2
            artifact-path: zmusic-neoforge/zmusic-neoforge-26.1.2/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: zmusic-neoforge-1.21.1
            mc-version: 1.21.1
            artifact-path: zmusic-neoforge/zmusic-neoforge-1.21.1/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: zmusic-neoforge-1.20.6
            mc-version: 1.20.6
            artifact-path: zmusic-neoforge/zmusic-neoforge-1.20.6/build/libs/**.jar
          - loader: NeoForge
            build-dir: builds/neoforge
            project: zmusic-neoforge-1.20.4
            mc-version: 1.20.4
            artifact-path: zmusic-neoforge/zmusic-neoforge-1.20.4/build/libs/**.jar
    steps:
      - uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/zmusic-player
          key: ${{ runner.os }}-gradle-${{ matrix.project }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.project }}-
            ${{ runner.os }}-gradle-
      - name: Build ${{ matrix.loader }} ${{ matrix.mc-version }}
        run: |
          ./gradlew --project-dir "${{ matrix.build-dir }}" ":${{ matrix.project }}:build" --no-daemon \
            -Pzmusic.project="${{ matrix.project }}" \
            -Porg.gradle.java.installations.paths="$(mise where java@temurin-8),$(mise where java@temurin-16),$(mise where java@temurin-17),$(mise where java@temurin-21),$(mise where java@temurin-25)"
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZMusic ${{ matrix.loader }} ${{ matrix.mc-version }}
          path: ${{ matrix.artifact-path }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v6
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*.jar

  publish-marketplaces:
    name: Publish ${{ matrix.loader }} ${{ matrix.mc-version }}
    runs-on: ubuntu-latest
    needs: release
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - loader: Fabric
            mod-loader: fabric
            mc-version: 26.1.2
            artifact-name: ZMusic Fabric 26.1.2
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.21.11
            artifact-name: ZMusic Fabric 1.21.11
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.21.5
            artifact-name: ZMusic Fabric 1.21.5
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.20.6
            artifact-name: ZMusic Fabric 1.20.6
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.20.4
            artifact-name: ZMusic Fabric 1.20.4
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.20.1
            artifact-name: ZMusic Fabric 1.20.1
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.19.4
            artifact-name: ZMusic Fabric 1.19.4
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.19.2
            artifact-name: ZMusic Fabric 1.19.2
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.18.2
            artifact-name: ZMusic Fabric 1.18.2
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.17.1
            artifact-name: ZMusic Fabric 1.17.1
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.16.5
            artifact-name: ZMusic Fabric 1.16.5
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.15.2
            artifact-name: ZMusic Fabric 1.15.2
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.14.4
            artifact-name: ZMusic Fabric 1.14.4
          - loader: Forge
            mod-loader: forge
            mc-version: 1.20.4
            artifact-name: ZMusic Forge 1.20.4
          - loader: Forge
            mod-loader: forge
            mc-version: 1.20.1
            artifact-name: ZMusic Forge 1.20.1
          - loader: Forge
            mod-loader: forge
            mc-version: 1.19.4
            artifact-name: ZMusic Forge 1.19.4
          - loader: Forge
            mod-loader: forge
            mc-version: 1.19.2
            artifact-name: ZMusic Forge 1.19.2
          - loader: Forge
            mod-loader: forge
            mc-version: 1.18.2
            artifact-name: ZMusic Forge 1.18.2
          - loader: Forge
            mod-loader: forge
            mc-version: 1.17.1
            artifact-name: ZMusic Forge 1.17.1
          - loader: Forge
            mod-loader: forge
            mc-version: 1.16.5
            artifact-name: ZMusic Forge 1.16.5
          - loader: Forge
            mod-loader: forge
            mc-version: 1.15.2
            artifact-name: ZMusic Forge 1.15.2
          - loader: Forge
            mod-loader: forge
            mc-version: 1.14.4
            artifact-name: ZMusic Forge 1.14.4
          - loader: Forge
            mod-loader: forge
            mc-version: 1.12.2
            artifact-name: ZMusic Forge 1.12.2
          - loader: NeoForge
            mod-loader: neoforge
            mc-version: 26.1.2
            artifact-name: ZMusic NeoForge 26.1.2
          - loader: NeoForge
            mod-loader: neoforge
            mc-version: 1.21.1
            artifact-name: ZMusic NeoForge 1.21.1
          - loader: NeoForge
            mod-loader: neoforge
            mc-version: 1.20.6
            artifact-name: ZMusic NeoForge 1.20.6
          - loader: NeoForge
            mod-loader: neoforge
            mc-version: 1.20.4
            artifact-name: ZMusic NeoForge 1.20.4
    steps:
      - uses: actions/checkout@v6
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: artifact
      - name: Publish to CurseForge and Modrinth
        env:
          MOD_LOADER: ${{ matrix.mod-loader }}
          MC_VERSION: ${{ matrix.mc-version }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_NAME: ZMusic ${{ github.ref_name }} ${{ matrix.loader }} ${{ matrix.mc-version }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          FILE_PATH="$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          if [ -z "$FILE_PATH" ]; then
            echo "No jar found in artifact" >&2
            find artifact -maxdepth 2 -type f -print >&2
            exit 1
          fi
          FILE_PATH="$FILE_PATH" bash scripts/publish-marketplace-file.sh

  sync-release:
    name: Sync release mirrors
    runs-on: ubuntu-latest
    needs:
      - release
      - publish-marketplaces
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Sync Release to Codeberg and CNB
        env:
          SOURCE_RELEASE_ID: ${{ needs.release.outputs.release-id }}
          GITHUB_TOKEN: ${{ github.token }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CODEBERG_REPO: zmusic-dev/zmusic-mod
          CNB_REPO: zmusic-dev/zmusic-mod
        run: bash scripts/sync-release.sh
