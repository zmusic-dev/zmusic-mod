name: Publish Marketplaces

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v3.7.0

jobs:
  publish:
    name: Publish ${{ matrix.loader }} ${{ matrix.mc-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - loader: Fabric
            mod-loader: fabric
            mc-version: 26.1.2
            artifact-name: ZMusic Fabric 26.1.2
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.21.11
            artifact-name: ZMusic Fabric 1.21.11
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.21.5
            artifact-name: ZMusic Fabric 1.21.5
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.20.6
            artifact-name: ZMusic Fabric 1.20.6
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.20.4
            artifact-name: ZMusic Fabric 1.20.4
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.20.1
            artifact-name: ZMusic Fabric 1.20.1
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.19.4
            artifact-name: ZMusic Fabric 1.19.4
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.19.2
            artifact-name: ZMusic Fabric 1.19.2
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.18.2
            artifact-name: ZMusic Fabric 1.18.2
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.17.1
            artifact-name: ZMusic Fabric 1.17.1
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.16.5
            artifact-name: ZMusic Fabric 1.16.5
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.15.2
            artifact-name: ZMusic Fabric 1.15.2
          - loader: Fabric
            mod-loader: fabric
            mc-version: 1.14.4
            artifact-name: ZMusic Fabric 1.14.4
          - loader: Forge
            mod-loader: forge
            mc-version: 1.20.4
            artifact-name: ZMusic Forge 1.20.4
          - loader: Forge
            mod-loader: forge
            mc-version: 1.20.1
            artifact-name: ZMusic Forge 1.20.1
          - loader: Forge
            mod-loader: forge
            mc-version: 1.19.4
            artifact-name: ZMusic Forge 1.19.4
          - loader: Forge
            mod-loader: forge
            mc-version: 1.19.2
            artifact-name: ZMusic Forge 1.19.2
          - loader: Forge
            mod-loader: forge
            mc-version: 1.18.2
            artifact-name: ZMusic Forge 1.18.2
          - loader: Forge
            mod-loader: forge
            mc-version: 1.17.1
            artifact-name: ZMusic Forge 1.17.1
          - loader: Forge
            mod-loader: forge
            mc-version: 1.16.5
            artifact-name: ZMusic Forge 1.16.5
          - loader: Forge
            mod-loader: forge
            mc-version: 1.15.2
            artifact-name: ZMusic Forge 1.15.2
          - loader: Forge
            mod-loader: forge
            mc-version: 1.14.4
            artifact-name: ZMusic Forge 1.14.4
          - loader: Forge
            mod-loader: forge
            mc-version: 1.12.2
            artifact-name: ZMusic Forge 1.12.2
          - loader: NeoForge
            mod-loader: neoforge
            mc-version: 26.1.2
            artifact-name: ZMusic NeoForge 26.1.2
          - loader: NeoForge
            mod-loader: neoforge
            mc-version: 1.21.1
            artifact-name: ZMusic NeoForge 1.21.1
          - loader: NeoForge
            mod-loader: neoforge
            mc-version: 1.20.6
            artifact-name: ZMusic NeoForge 1.20.6
          - loader: NeoForge
            mod-loader: neoforge
            mc-version: 1.20.4
            artifact-name: ZMusic NeoForge 1.20.4
    steps:
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifact
          gh -R "${{ github.repository }}" release download "$TAG" \
            -D artifact \
            -p "zmusic-${{ matrix.mod-loader }}-${{ matrix.mc-version }}-${TAG#v}.jar"
      - name: Publish to CurseForge and Modrinth
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: ZMusic ${{ inputs.tag }} ${{ matrix.loader }} ${{ matrix.mc-version }}
          version: ${{ inputs.tag }}
          files: artifact/**/*.jar
          loaders: ${{ matrix.mod-loader }}
          game-versions: ${{ matrix.mc-version }}
          version-type: release
          retry-attempts: 3
