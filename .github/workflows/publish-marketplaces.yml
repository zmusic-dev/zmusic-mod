name: Publish Marketplaces

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v3.8.0
      dry-run:
        description: Validate marketplace metadata without publishing files
        required: true
        default: true
        type: boolean

jobs:
  publish:
    name: Publish ${{ matrix.loader }} ${{ matrix.target-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - loader: Fabric
            mod-loader: fabric
            target-version: "26.2"
            supported-versions: "26.2"
            artifact-name: ZMusic Fabric 26.2
          - loader: Fabric
            mod-loader: fabric
            target-version: 26.1.2
            supported-versions: 26.1 26.1.1 26.1.2
            artifact-name: ZMusic Fabric 26.1.2
          - loader: Fabric
            mod-loader: fabric
            target-version: 1.21.11
            supported-versions: 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11
            artifact-name: ZMusic Fabric 1.21.11
          - loader: Fabric
            mod-loader: fabric
            target-version: 1.21.5
            supported-versions: 1.21 1.21.1 1.21.2 1.21.3 1.21.4 1.21.5
            artifact-name: ZMusic Fabric 1.21.5
          - loader: Fabric
            mod-loader: fabric
            target-version: 1.20.6
            supported-versions: 1.20.5 1.20.6
            artifact-name: ZMusic Fabric 1.20.6
          - loader: Fabric
            mod-loader: fabric
            target-version: 1.20.4
            supported-versions: 1.20.2 1.20.3 1.20.4
            artifact-name: ZMusic Fabric 1.20.4
          - loader: Fabric
            mod-loader: fabric
            target-version: 1.20.1
            supported-versions: 1.20 1.20.1
            artifact-name: ZMusic Fabric 1.20.1
          - loader: Fabric
            mod-loader: fabric
            target-version: 1.19.4
            supported-versions: 1.19.4
            artifact-name: ZMusic Fabric 1.19.4
          - loader: Fabric
            mod-loader: fabric
            target-version: 1.19.2
            supported-versions: 1.19.2
            artifact-name: ZMusic Fabric 1.19.2
          - loader: Fabric
            mod-loader: fabric
            target-version: 1.18.2
            supported-versions: 1.18.2
            artifact-name: ZMusic Fabric 1.18.2
          - loader: Fabric
            mod-loader: fabric
            target-version: 1.17.1
            supported-versions: 1.17 1.17.1
            artifact-name: ZMusic Fabric 1.17.1
          - loader: Fabric
            mod-loader: fabric
            target-version: 1.16.5
            supported-versions: 1.16 1.16.1 1.16.2 1.16.3 1.16.4 1.16.5
            artifact-name: ZMusic Fabric 1.16.5
          - loader: Fabric
            mod-loader: fabric
            target-version: 1.15.2
            supported-versions: 1.15 1.15.1 1.15.2
            artifact-name: ZMusic Fabric 1.15.2
          - loader: Fabric
            mod-loader: fabric
            target-version: 1.14.4
            supported-versions: 1.14.3 1.14.4
            artifact-name: ZMusic Fabric 1.14.4
          - loader: Forge
            mod-loader: forge
            target-version: 1.20.4
            supported-versions: 1.20 1.20.1
            artifact-name: ZMusic Forge 1.20.4
          - loader: Forge
            mod-loader: forge
            target-version: 1.20.1
            supported-versions: 1.20 1.20.1
            artifact-name: ZMusic Forge 1.20.1
          - loader: Forge
            mod-loader: forge
            target-version: 1.19.4
            supported-versions: 1.19.4
            artifact-name: ZMusic Forge 1.19.4
          - loader: Forge
            mod-loader: forge
            target-version: 1.19.2
            supported-versions: 1.19.2
            artifact-name: ZMusic Forge 1.19.2
          - loader: Forge
            mod-loader: forge
            target-version: 1.18.2
            supported-versions: 1.18 1.18.1 1.18.2
            artifact-name: ZMusic Forge 1.18.2
          - loader: Forge
            mod-loader: forge
            target-version: 1.17.1
            supported-versions: 1.17.1
            artifact-name: ZMusic Forge 1.17.1
          - loader: Forge
            mod-loader: forge
            target-version: 1.16.5
            supported-versions: 1.16.1 1.16.2 1.16.3 1.16.4 1.16.5
            artifact-name: ZMusic Forge 1.16.5
          - loader: Forge
            mod-loader: forge
            target-version: 1.15.2
            supported-versions: 1.15 1.15.1 1.15.2
            artifact-name: ZMusic Forge 1.15.2
          - loader: Forge
            mod-loader: forge
            target-version: 1.14.4
            supported-versions: 1.14.4
            artifact-name: ZMusic Forge 1.14.4
          - loader: Forge
            mod-loader: forge
            target-version: 1.12.2
            supported-versions: 1.12.2
            artifact-name: ZMusic Forge 1.12.2
          - loader: NeoForge
            mod-loader: neoforge
            target-version: "26.2"
            supported-versions: "26.2"
            artifact-name: ZMusic NeoForge 26.2
          - loader: NeoForge
            mod-loader: neoforge
            target-version: 26.1.2
            supported-versions: 26.1 26.1.1 26.1.2
            artifact-name: ZMusic NeoForge 26.1.2
          - loader: NeoForge
            mod-loader: neoforge
            target-version: 1.21.1
            supported-versions: 1.21.1
            artifact-name: ZMusic NeoForge 1.21.1
          - loader: NeoForge
            mod-loader: neoforge
            target-version: 1.20.6
            supported-versions: 1.20.5 1.20.6
            artifact-name: ZMusic NeoForge 1.20.6
          - loader: NeoForge
            mod-loader: neoforge
            target-version: 1.20.4
            supported-versions: 1.20.2 1.20.3 1.20.4
            artifact-name: ZMusic NeoForge 1.20.4
    steps:
      - uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifact
          gh -R "${{ github.repository }}" release download "$TAG" \
            -D artifact \
            -p "zmusic-${{ matrix.mod-loader }}-${{ matrix.target-version }}-${TAG#v}.jar"
      - name: Download release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh -R "${{ github.repository }}" release view "$TAG" \
            --json body \
            --jq '.body // ""' > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "release notes are empty for $TAG" >&2
            exit 1
          fi
      - name: Publish to CurseForge and Modrinth
        env:
          MOD_LOADER: ${{ matrix.mod-loader }}
          MC_VERSION: ${{ matrix.target-version }}
          MC_VERSIONS: ${{ matrix.supported-versions }}
          RELEASE_VERSION: ${{ inputs.tag }}
          RELEASE_NAME: ZMusic ${{ inputs.tag }} ${{ matrix.loader }} ${{ matrix.target-version }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          FILE_PATH="$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          if [ -z "$FILE_PATH" ]; then
            echo "No jar found in artifact" >&2
            find artifact -maxdepth 2 -type f -print >&2
            exit 1
          fi
          FILE_PATH="$(realpath "$FILE_PATH")"
          CHANGELOG="$(cat release-notes.md)" \
            FILE_PATH="$FILE_PATH" \
            ./gradlew --project-dir builds/publish publishMarketplaceFile --no-daemon
