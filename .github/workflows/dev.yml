name: Dev Build

on:
  workflow_dispatch:
  push:
    paths:
      - "**.java"
      - "**.gradle"
      - "**.json"
      - "**.toml"
      - ".github/workflows/dev.yml"
    branches:
      - "dev"
  pull_request:
    branches:
      - "dev"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/caches/forge_gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build
        run: mise run build
      # Fabric 1.21.8
      - name: Upload Artifact (Fabric 1.21.8)
        uses: actions/upload-artifact@v7
        with:
          name: 'ZMusic Fabric 1.21.8'
          path: |
            zmusic-fabric/zmusic-fabric-1.21.8/build/libs/**.jar
      # Fabric 1.21
      - name: Upload Artifact (Fabric 1.21)
        uses: actions/upload-artifact@v7
        with:
          name: 'ZMusic Fabric 1.21'
          path: |
            zmusic-fabric/zmusic-fabric-1.21/build/libs/**.jar
      # Fabric 1.20.5
