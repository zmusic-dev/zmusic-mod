name: Sync Release

on:
  workflow_dispatch:
    inputs:
      release-id:
        description: GitHub Release id to sync
        required: true
  release:
    types:
      - published

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Sync Release to Codeberg and CNB
        env:
          SOURCE_RELEASE_ID: ${{ github.event.release.id || inputs.release-id }}
          GITHUB_TOKEN: ${{ github.token }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CODEBERG_REPO: zmusic-dev/zmusic-mod
          CNB_REPO: zmusic-dev/zmusic-mod
        run: bash scripts/sync-release.sh
