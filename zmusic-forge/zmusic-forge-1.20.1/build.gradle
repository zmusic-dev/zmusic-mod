plugins {
    id 'net.minecraftforge.gradle' version '7.0.31'
    id 'net.minecraftforge.renamer' version '1.1.3'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:1.20.1-47.4.20")
    implementation project(":zmusic-core")
}

jar {
    dependsOn(":zmusic-core:jar")
}
