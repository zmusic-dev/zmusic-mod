plugins {
    id 'net.minecraftforge.gradle' version '7.0.36'
    id 'net.minecraftforge.renamer' version '1.1.3'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: '1.19.2'
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.19.2-43.2.0')
    implementation project(":zmusic-core")
}

jar {
    dependsOn(":zmusic-core:jar")
}
