plugins {
    id 'net.minecraftforge.gradle' version '7.0.25'
    id 'net.minecraftforge.renamer' version '1.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: '1.17.1'
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.17.1-37.1.1')
    implementation project(":zmusic-core")
}

jar {
    dependsOn(":zmusic-core:jar")
}
