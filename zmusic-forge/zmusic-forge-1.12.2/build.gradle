plugins {
    id 'net.minecraftforge.gradle' version '7.0.31'
    id 'net.minecraftforge.renamer' version '1.1.5'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.12.2-14.23.5.2859')
    implementation project(":zmusic-core")
}

jar {
    dependsOn(":zmusic-core:jar")
}
