plugins {
    id 'net.minecraftforge.gradle' version '7.0.30'
    id 'net.minecraftforge.renamer' version '1.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

minecraft {
    mappings channel: 'snapshot', version: '20190719-1.14.3'
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.14.4-28.2.26')
    implementation project(":zmusic-core")
}

jar {
    dependsOn(":zmusic-core:jar")
}
