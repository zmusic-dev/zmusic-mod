plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

description = 'NeoForge 1.21.1 adapter for ZMusic.'

base {
    archivesName = 'zmusic-neoforge-1.21.1'
}

configurations {
    kotlinRuntime
}

dependencies {
    kotlinRuntime 'org.jetbrains.kotlin:kotlin-stdlib:2.4.0'

    jarJar(implementation("me.zhenxin:zmusic-shared:${project.version}"))

    jarJar(implementation(group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib')) {
        version {
            strictly '[2.4.0,2.5.0)'
            prefer '2.4.0'
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.221'

    runs {
        client {
            client()
        }
    }

    runs.configureEach {
        additionalRuntimeClasspathConfiguration.extendsFrom(configurations.kotlinRuntime)
    }

    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }

    mods {
        zmusic {
            sourceSet(sourceSets.main)
        }
    }
}
