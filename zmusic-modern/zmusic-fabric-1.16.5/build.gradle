plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15.3'
}

description = 'Fabric 1.16.5 adapter for ZMusic.'

base {
    archivesName = 'zmusic-fabric-1.16.5'
}

dependencies {
    minecraft 'com.mojang:minecraft:1.16.5'
    mappings 'net.fabricmc:yarn:1.16.5+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.42.0+1.16'
    modImplementation 'net.fabricmc:fabric-language-kotlin:1.13.12+kotlin.2.4.0'
    include "me.zhenxin:zmusic-shared:${project.version}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 8
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
