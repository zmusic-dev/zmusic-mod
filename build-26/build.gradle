plugins {
    id("net.fabricmc.fabric-loom") version "1.16.2" apply false
    id("net.neoforged.gradle.userdev") version "7.1.25" apply false
}

ext {
    zmusicPlayerVersion = project.hasProperty('zmusicPlayerVersion')
            ? project.property('zmusicPlayerVersion').toString()
            : (project.findProperty('zmusicPlayerVersion')?.toString() ?: '1.0.0-alpha.2')
    nativePlatforms = [
        'x86_64-linux'   : [libName: 'libzmusic.so',    pattern: ~/zmusic-x86_64-linux-.*\.tar\.gz/],
        'x86_64-windows' : [libName: 'zmusic.dll',      pattern: ~/zmusic-x86_64-windows-.*\.zip/],
        'aarch64-macos'  : [libName: 'libzmusic.dylib', pattern: ~/zmusic-aarch64-macos-.*\.tar\.gz/],
        'x86_64-macos'   : [libName: 'libzmusic.dylib', pattern: ~/zmusic-x86_64-macos-.*\.tar\.gz/]
    ]
}

def nativeBuildDir = layout.buildDirectory.dir("native")
def nativeCacheDir = layout.projectDirectory.dir("../.gradle/zmusic-player")

tasks.register('downloadNativeLibs') {
    inputs.property('zmusicPlayerVersion', zmusicPlayerVersion)
    outputs.dir(nativeBuildDir)

    doLast {
        def outDir = nativeBuildDir.get().asFile
        if (outDir.exists()) {
            outDir.deleteDir()
        }
        outDir.mkdirs()

        def apiUrl = "https://api.github.com/repos/zmusic-dev/zmusic-player/releases/tags/v${zmusicPlayerVersion}"
        def conn = new URL(apiUrl).openConnection()
        conn.setRequestProperty('Accept', 'application/vnd.github+json')
        conn.setRequestProperty('User-Agent', 'ZMusic-Gradle-Build')

        if (conn.responseCode != 200) {
            throw new GradleException(
                    "Failed to fetch zmusic-player release info (HTTP ${conn.responseCode}). "
                            + "Check version '${zmusicPlayerVersion}' and GitHub API rate limits.")
        }

        def json = new groovy.json.JsonSlurper().parse(conn.inputStream as InputStream)
        conn.disconnect()

        nativePlatforms.each { platform, config ->
            def libName = config.libName as String
            def platformDir = new File(outDir, platform)
            def libFile = new File(platformDir, libName)
            platformDir.mkdirs()

            def asset = json.assets.find { it.name ==~ config.pattern }
            if (!asset) {
                throw new GradleException("No zmusic-player asset found for platform '${platform}'")
            }

            def versionCacheDir = new File(nativeCacheDir.asFile, "v${zmusicPlayerVersion}")
            versionCacheDir.mkdirs()
            def archiveFile = new File(versionCacheDir, asset.name as String)

            if (!archiveFile.exists() || archiveFile.length() == 0) {
                logger.lifecycle("Downloading zmusic-player native lib: ${asset.name}")
                ant.get(src: asset.browser_download_url as String, dest: archiveFile)
            } else {
                logger.lifecycle("Using cached zmusic-player native lib: ${asset.name}")
            }

            if (archiveFile.name.endsWith('.tar.gz') || archiveFile.name.endsWith('.tgz')) {
                ant.untar(src: archiveFile, dest: platformDir, compression: 'gzip') {
                    patternset { include(name: "**/${libName}") }
                    mapper(type: 'flatten')
                }
            } else if (archiveFile.name.endsWith('.zip')) {
                ant.unzip(src: archiveFile, dest: platformDir) {
                    patternset { include(name: "**/${libName}") }
                    mapper(type: 'flatten')
                }
            } else {
                throw new GradleException("Unsupported zmusic-player archive: ${archiveFile.name}")
            }

            if (!libFile.exists() || libFile.length() == 0) {
                throw new GradleException("Failed to extract ${platform}/${libName} from archive")
            }
        }
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'Jitpack'
            url = 'https://jitpack.io'
        }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/releases/"
        }
    }
}

subprojects {
    apply plugin: 'java-library'

    group = "me.zhenxin"
    version = "3.6.0"

    dependencies {
        compileOnly("org.projectlombok:lombok:1.18.46")
        annotationProcessor("org.projectlombok:lombok:1.18.46")
    }

    jar {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        from {
            configurations.runtimeClasspath.collect {
                if (project.name != "zmusic-core" && it.name.contains("zmusic-core")) {
                    it.isDirectory() ? it : zipTree(it)
                }
            }
        }

        from("${rootDir}/../LICENSE")

        if (project.name == "zmusic-fabric-26.1" || project.name == "zmusic-neoforge-26.1") {
            dependsOn(rootProject.tasks.named('downloadNativeLibs'))
            from(nativeBuildDir) {
                include('*/libzmusic.so', '*/zmusic.dll', '*/libzmusic.dylib')
                into('META-INF/native')
            }
        }
    }

    processResources {
        inputs.property "version", project.version

        filesMatching("fabric.mod.json") {
            expand "version": project.version
        }

        filesMatching("META-INF/neoforge.mods.toml") {
            expand "version": project.version
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
