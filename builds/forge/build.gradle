ext {
    modDescription = "Powerful Music System"
    zmusicPlayerVersion = project.hasProperty('zmusicPlayerVersion')
            ? project.property('zmusicPlayerVersion').toString()
            : (project.findProperty('zmusicPlayerVersion')?.toString() ?: '1.0.0-alpha.6')
    nativePlatforms = [
        'x86_64-linux'   : [libName: 'libzmusic.so',    pattern: ~/zmusic-x86_64-linux-.*\.tar\.gz/],
        'aarch64-linux'  : [libName: 'libzmusic.so',    pattern: ~/zmusic-aarch64-linux-.*\.tar\.gz/],
        'aarch64-android': [libName: 'libzmusic.so',    pattern: ~/zmusic-aarch64-android-.*\.tar\.gz/],
        'x86_64-windows' : [libName: 'zmusic.dll',      pattern: ~/zmusic-x86_64-windows-msvc-.*\.zip/],
        'aarch64-windows': [libName: 'zmusic.dll',      pattern: ~/zmusic-aarch64-windows-msvc-.*\.zip/],
        'aarch64-macos'  : [libName: 'libzmusic.dylib', pattern: ~/zmusic-aarch64-macos-.*\.tar\.gz/],
        'x86_64-macos'   : [libName: 'libzmusic.dylib', pattern: ~/zmusic-x86_64-macos-.*\.tar\.gz/]
    ]
}

def ensureValidZip(File file) {
    if (!file.exists() || file.length() == 0) {
        return false
    }
    try {
        new java.util.zip.ZipFile(file).close()
        return true
    } catch (java.util.zip.ZipException ignored) {
        return false
    }
}

def repairLegacyForgeToolCache() {
    def specialSource = new File(
            gradle.gradleUserHomeDir,
            "caches/minecraftforge/forgegradle/mavenizer/caches/maven/mcp-tools/net/md-5/SpecialSource/1.8.3/SpecialSource-1.8.3-shaded.jar"
    )
    if (ensureValidZip(specialSource)) {
        return
    }

    specialSource.parentFile.mkdirs()
    logger.lifecycle("Repairing Forge Mavenizer cache: ${specialSource.name}")
    ant.get(
            src: "https://repo.maven.apache.org/maven2/net/md-5/SpecialSource/1.8.3/SpecialSource-1.8.3-shaded.jar",
            dest: specialSource
    )
    new File(specialSource.parentFile, "${specialSource.name}.sha1").text = "54cae54ef5426ef16660eb8bb3bf95d05be3fecd"
}

repairLegacyForgeToolCache()

def nativeBuildDir = layout.buildDirectory.dir("native")
def nativeCacheDir = layout.projectDirectory.dir("../../.gradle/zmusic-player")

def isForgeProject(Project p) {
    return p.name ==~ /zmusic-forge-\d+.*/
}

tasks.register('downloadNativeLibs') {
    inputs.property('zmusicPlayerVersion', zmusicPlayerVersion)
    outputs.dir(nativeBuildDir)

    doLast {
        def outDir = nativeBuildDir.get().asFile
        if (outDir.exists()) {
            outDir.deleteDir()
        }
        outDir.mkdirs()

        def apiUrl = "https://api.github.com/repos/starhui-dev/zmusic-player/releases/tags/v${zmusicPlayerVersion}"
        def conn = new URL(apiUrl).openConnection()
        conn.setRequestProperty('Accept', 'application/vnd.github+json')
        conn.setRequestProperty('User-Agent', 'ZMusic-Gradle-Build')
        def githubToken = System.getenv('GITHUB_TOKEN') ?: System.getenv('MISE_GITHUB_TOKEN')
        if (githubToken) {
            conn.setRequestProperty('Authorization', "Bearer ${githubToken}")
        }

        if (conn.responseCode != 200) {
            throw new GradleException(
                    "Failed to fetch zmusic-player release info (HTTP ${conn.responseCode}). "
                            + "Check version '${zmusicPlayerVersion}' and GitHub API rate limits.")
        }

        def json = new groovy.json.JsonSlurper().parse(conn.inputStream as InputStream)
        conn.disconnect()

        nativePlatforms.each { platform, config ->
            def libName = config.libName as String
            def platformDir = new File(outDir, platform)
            def libFile = new File(platformDir, libName)
            platformDir.mkdirs()

            def asset = json.assets.find { it.name ==~ config.pattern }
            if (!asset) {
                throw new GradleException("No zmusic-player asset found for platform '${platform}'")
            }

            def versionCacheDir = new File(nativeCacheDir.asFile, "v${zmusicPlayerVersion}")
            versionCacheDir.mkdirs()
            def archiveFile = new File(versionCacheDir, asset.name as String)

            if (!archiveFile.exists() || archiveFile.length() == 0) {
                logger.lifecycle("Downloading zmusic-player native lib: ${asset.name}")
                ant.get(src: asset.browser_download_url as String, dest: archiveFile)
            } else {
                logger.lifecycle("Using cached zmusic-player native lib: ${asset.name}")
            }

            if (archiveFile.name.endsWith('.tar.gz') || archiveFile.name.endsWith('.tgz')) {
                ant.untar(src: archiveFile, dest: platformDir, compression: 'gzip') {
                    patternset { include(name: "**/${libName}") }
                    mapper(type: 'flatten')
                }
            } else if (archiveFile.name.endsWith('.zip')) {
                ant.unzip(src: archiveFile, dest: platformDir) {
                    patternset { include(name: "**/${libName}") }
                    mapper(type: 'flatten')
                }
            } else {
                throw new GradleException("Unsupported zmusic-player archive: ${archiveFile.name}")
            }

            if (!libFile.exists() || libFile.length() == 0) {
                throw new GradleException("Failed to extract ${platform}/${libName} from archive")
            }
        }
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven {
            name = 'Jitpack'
            url = 'https://jitpack.io'
        }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/releases/"
        }
    }
}

subprojects {
    apply plugin: 'java-library'

    group = "me.zhenxin"
    version = "3.8.2"

    pluginManager.withPlugin("net.minecraftforge.gradle") {
        repositories {
            project.minecraft.mavenizer(it)
            maven project.fg.forgeMaven
            maven project.fg.minecraftLibsMaven
        }
    }

    dependencies {
        compileOnly("org.projectlombok:lombok:1.18.46")
        annotationProcessor("org.projectlombok:lombok:1.18.46")
    }

    jar {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        if (project.name != "zmusic-core") {
            from(project(":zmusic-core").sourceSets.main.output)
        }

        from("${rootDir}/../../LICENSE")

        if (isForgeProject(project)) {
            manifest {
                attributes([
                        "Specification-Title"     : "zmusic",
                        "Specification-Vendor"    : "ZhenXin",
                        "Specification-Version"   : "1",
                        "Implementation-Title"    : "ZMusic",
                        "Implementation-Version"  : project.version,
                        "Implementation-Vendor"   : "ZhenXin",
                        "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
                ])
            }

            dependsOn(rootProject.tasks.named('downloadNativeLibs'))
            from(nativeBuildDir) {
                include('*/libzmusic.so', '*/zmusic.dll', '*/libzmusic.dylib')
                into('META-INF/native')
            }
        }
    }

    processResources {
        inputs.property "version", project.version
        inputs.property "description", rootProject.modDescription

        if (isForgeProject(project)) {
            from(project(":zmusic-core").sourceSets.main.resources) {
                include("icon.png")
            }
        }

        filesMatching("META-INF/mods.toml") {
            expand "version": project.version, "description": rootProject.modDescription
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
