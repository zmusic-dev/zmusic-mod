pluginManagement {
    repositories {
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "zmusic-forge"

include("zmusic-core")
project(":zmusic-core").projectDir = file("../../zmusic-core")

def forgeProjects = [
        "zmusic-forge-1.12.2",
        "zmusic-forge-1.14.4",
        "zmusic-forge-1.15.2",
        "zmusic-forge-1.16.5",
        "zmusic-forge-1.17.1",
        "zmusic-forge-1.18.2",
        "zmusic-forge-1.19.2",
        "zmusic-forge-1.19.4",
        "zmusic-forge-1.20.1",
        "zmusic-forge-1.20.4"
]

def selectedProject = providers.gradleProperty("zmusic.project").orNull
def selectedProjects = selectedProject ? [selectedProject] : forgeProjects

selectedProjects.each { projectName ->
    if (!forgeProjects.contains(projectName)) {
        throw new GradleException("Unknown Forge project: ${projectName}")
    }
    include(projectName)
    project(":${projectName}").projectDir = file("../../zmusic-forge/${projectName}")
}
