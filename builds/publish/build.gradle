def publishMarketplaceLog = { String message ->
    println("[publish-marketplace] ${message}")
}

def publishMarketplaceFail = { String message ->
    throw new GradleException("[publish-marketplace] ${message}")
}

def requirePublishEnv = { String name ->
    def value = System.getenv(name)
    if (value == null || value.isBlank()) {
        publishMarketplaceFail("missing required environment variable: ${name}")
    }
    value
}

def publishApiRequest = { String method, String url, Map<String, String> headers = [:], Closure bodyWriter = null ->
    def requestBuilder = java.net.http.HttpRequest.newBuilder(java.net.URI.create(url))
    requestBuilder.header('User-Agent', 'ZMusic-Gradle-Publish')
    headers.each { key, value ->
        requestBuilder.header(key, value)
    }

    def bodyPublisher = java.net.http.HttpRequest.BodyPublishers.noBody()
    if (bodyWriter != null) {
        def outputStream = new ByteArrayOutputStream()
        bodyWriter(outputStream)
        bodyPublisher = java.net.http.HttpRequest.BodyPublishers.ofByteArray(outputStream.toByteArray())
    }

    def request = requestBuilder
        .method(method, bodyPublisher)
        .build()
    def response = java.net.http.HttpClient.newBuilder()
        .followRedirects(java.net.http.HttpClient.Redirect.NORMAL)
        .build()
        .send(request, java.net.http.HttpResponse.BodyHandlers.ofString(java.nio.charset.StandardCharsets.UTF_8))

    [status: response.statusCode(), body: response.body()]
}

def publishApiRequestWithoutBody = { String method, String url, Map<String, String> headers = [:] ->
    publishApiRequest(method, url, headers)
}

def expectPublishStatus = { response, List<Integer> expected ->
    if (!expected.contains(response.status as Integer)) {
        publishMarketplaceFail("unexpected HTTP status: ${response.status}, response: ${response.body ?: '<empty>'}")
    }
}

def prettyPublishJson = { value ->
    groovy.json.JsonOutput.prettyPrint(value instanceof String ? value : groovy.json.JsonOutput.toJson(value))
}

def encodePublishUri = { String value ->
    java.net.URLEncoder.encode(value, 'UTF-8').replace('+', '%20')
}

def requirePublishRepoSlug = { String slug ->
    if (!slug.contains('/')) {
        publishMarketplaceFail("invalid repository slug: ${slug}")
    }
    slug
}

def loaderDisplayName = { String loader ->
    switch (loader) {
        case 'fabric': return 'Fabric'
        case 'forge': return 'Forge'
        case 'neoforge': return 'NeoForge'
        default: publishMarketplaceFail("unsupported loader: ${loader}")
    }
}

def writeMultipart = { OutputStream outputStream, String boundary, Map<String, String> fields, File file, String fileField, String fileName ->
    outputStream.withCloseable { out ->
        fields.each { key, value ->
            out.write("--${boundary}\r\n".getBytes('UTF-8'))
            out.write("Content-Disposition: form-data; name=\"${key}\"\r\n\r\n".getBytes('UTF-8'))
            out.write(value.getBytes('UTF-8'))
            out.write("\r\n".getBytes('UTF-8'))
        }

        out.write("--${boundary}\r\n".getBytes('UTF-8'))
        out.write("Content-Disposition: form-data; name=\"${fileField}\"; filename=\"${fileName}\"\r\n".getBytes('UTF-8'))
        out.write("Content-Type: application/java-archive\r\n\r\n".getBytes('UTF-8'))
        file.withInputStream { input ->
            input.transferTo(out)
        }
        out.write("\r\n--${boundary}--\r\n".getBytes('UTF-8'))
    }
}

def writeFileOnlyMultipart = { OutputStream outputStream, String boundary, File file, String fileField, String fileName ->
    outputStream.withCloseable { out ->
        out.write("--${boundary}\r\n".getBytes('UTF-8'))
        out.write("Content-Disposition: form-data; name=\"${fileField}\"; filename=\"${fileName}\"\r\n".getBytes('UTF-8'))
        out.write("Content-Type: application/java-archive\r\n\r\n".getBytes('UTF-8'))
        file.withInputStream { input ->
            input.transferTo(out)
        }
        out.write("\r\n--${boundary}--\r\n".getBytes('UTF-8'))
    }
}

def parsePublishVersions = {
    def rawVersions = System.getenv('MC_VERSIONS') ?: requirePublishEnv('MC_VERSION')
    def versions = rawVersions.replace(',', ' ').split(/\s+/).findAll { !it.isBlank() }
    if (versions.isEmpty()) {
        publishMarketplaceFail('missing Minecraft versions')
    }
    versions
}

def curseForgeGameVersionId = { List versions, List versionTypes, String versionName, String kind ->
    List matches
    switch (kind) {
        case 'loader':
            matches = versions.findAll {
                it.name == versionName && it.gameVersionTypeID == 68441
            }
            break
        case 'minecraft':
            def minecraftTypeIds = versionTypes.findAll {
                (it.name as String).startsWith('Minecraft ')
            }.collect { it.id }
            matches = versions.findAll {
                it.name == versionName && minecraftTypeIds.contains(it.gameVersionTypeID)
            }
            break
        default:
            publishMarketplaceFail("unsupported CurseForge game version kind: ${kind}")
    }

    if (matches.size() != 1) {
        publishMarketplaceFail("expected one CurseForge ${kind} version id for ${versionName}, got ${matches.size()}: ${groovy.json.JsonOutput.toJson(matches.collect { it.id })}")
    }

    matches[0].id
}

tasks.register('publishMarketplaceFile') {
    group = 'publishing'
    description = 'Publishes or dry-runs one built ZMusic jar on Modrinth and CurseForge.'

    doLast {
        def filePath = requirePublishEnv('FILE_PATH')
        def modLoader = requirePublishEnv('MOD_LOADER')
        def mcVersion = requirePublishEnv('MC_VERSION')
        def releaseVersion = requirePublishEnv('RELEASE_VERSION')
        def file = new File(filePath)
        if (!file.isFile()) {
            publishMarketplaceFail("file does not exist: ${filePath}")
        }

        def fileName = file.name
        def releaseName = System.getenv('RELEASE_NAME') ?: "ZMusic ${releaseVersion} ${modLoader} ${mcVersion}"
        def changelog = System.getenv('CHANGELOG') ?: ''
        def modrinthApiBaseUrl = System.getenv('MODRINTH_API_BASE_URL') ?: 'https://api.modrinth.com/v2'
        def curseForgeApiBaseUrl = System.getenv('CURSEFORGE_API_BASE_URL') ?: 'https://minecraft.curseforge.com'
        def publishModrinth = System.getenv('PUBLISH_MODRINTH') ?: 'true'
        def publishCurseForge = System.getenv('PUBLISH_CURSEFORGE') ?: 'true'
        def dryRun = System.getenv('DRY_RUN') ?: 'false'
        def minecraftVersions = parsePublishVersions()

        if (!(dryRun in ['true', 'false'])) {
            publishMarketplaceFail("DRY_RUN must be true or false")
        }

        if (publishModrinth == 'true') {
            def projectId = requirePublishEnv('MODRINTH_PROJECT_ID')
            def token = requirePublishEnv('MODRINTH_TOKEN')
            def metadata = [
                    name            : releaseName,
                    version_number  : releaseVersion,
                    changelog       : changelog,
                    dependencies    : [],
                    game_versions   : minecraftVersions,
                    version_type    : 'release',
                    loaders         : [modLoader],
                    featured        : false,
                    status          : 'listed',
                    requested_status: 'listed',
                    project_id      : projectId,
                    file_parts      : ['file'],
                    primary_file    : 'file'
            ]

            def response = publishApiRequest(
                    'GET',
                    "${modrinthApiBaseUrl.replaceAll('/+$', '')}/project/${projectId}/version",
                    ['Authorization': "Bearer ${token}", 'Accept': 'application/json']
            )
            expectPublishStatus(response, [200])
            def versions = new groovy.json.JsonSlurper().parseText(response.body) as List

            def existing = versions.findAll {
                it.version_number == releaseVersion
                        && (it.loaders as List).contains(modLoader)
                        && ((it.files ?: []).collect { f -> f.filename }).contains(fileName)
            }
            def matching = existing.findAll {
                def publishedVersions = it.game_versions as List
                minecraftVersions.every { publishedVersions.contains(it) }
            }

            if (!matching.isEmpty()) {
                publishMarketplaceLog("Modrinth already has ${fileName}; skipping")
            } else {
                if (!existing.isEmpty()) {
                    publishMarketplaceFail("Modrinth already has ${fileName} but its game_versions do not cover: ${minecraftVersions.join(' ')}")
                }

                def metadataJson = groovy.json.JsonOutput.toJson(metadata)
                if (dryRun == 'true') {
                    publishMarketplaceLog('DRY_RUN Modrinth metadata:')
                    println(prettyPublishJson(metadataJson))
                } else {
                    publishMarketplaceLog("Publishing Modrinth: ${releaseName} (${modLoader} ${minecraftVersions.join(' ')})")
                    def boundary = "----ZMusicGradle${System.nanoTime()}"
                    response = publishApiRequest(
                            'POST',
                            "${modrinthApiBaseUrl.replaceAll('/+$', '')}/version",
                            [
                                    'Authorization': "Bearer ${token}",
                                    'Accept'       : 'application/json',
                                    'Content-Type' : "multipart/form-data; boundary=${boundary}"
                            ]
                    ) { OutputStream out ->
                        writeMultipart(out, boundary, [data: metadataJson], file, 'file', fileName)
                    }
                    expectPublishStatus(response, [200])
                    publishMarketplaceLog('Modrinth response:')
                    println(prettyPublishJson(response.body))
                }
            }
        } else if (publishModrinth == 'false') {
            publishMarketplaceLog('Skipping Modrinth')
        } else {
            publishMarketplaceFail('PUBLISH_MODRINTH must be true or false')
        }

        if (publishCurseForge == 'true') {
            def projectId = requirePublishEnv('CURSEFORGE_PROJECT_ID')
            def token = requirePublishEnv('CURSEFORGE_TOKEN')
            def loaderName = loaderDisplayName(modLoader)

            def response = publishApiRequest(
                    'GET',
                    "${curseForgeApiBaseUrl.replaceAll('/+$', '')}/api/game/versions",
                    ['X-Api-Token': token, 'Accept': 'application/json']
            )
            expectPublishStatus(response, [200])
            def curseForgeVersions = new groovy.json.JsonSlurper().parseText(response.body) as List

            response = publishApiRequest(
                    'GET',
                    "${curseForgeApiBaseUrl.replaceAll('/+$', '')}/api/game/version-types",
                    ['X-Api-Token': token, 'Accept': 'application/json']
            )
            expectPublishStatus(response, [200])
            def curseForgeVersionTypes = new groovy.json.JsonSlurper().parseText(response.body) as List

            def loaderVersionId = curseForgeGameVersionId(curseForgeVersions, curseForgeVersionTypes, loaderName, 'loader')
            def minecraftVersionIds = minecraftVersions.collect {
                curseForgeGameVersionId(curseForgeVersions, curseForgeVersionTypes, it, 'minecraft')
            }
            def gameVersionIds = ([loaderVersionId] + minecraftVersionIds).collect { it as Integer }
            def metadata = [
                    changelog    : changelog,
                    changelogType: 'markdown',
                    displayName  : releaseName,
                    gameVersions : gameVersionIds,
                    releaseType  : 'release'
            ]
            def metadataJson = groovy.json.JsonOutput.toJson(metadata)

            if (dryRun == 'true') {
                publishMarketplaceLog('DRY_RUN CurseForge metadata:')
                println(prettyPublishJson(metadataJson))
            } else {
                publishMarketplaceLog("Publishing CurseForge: ${releaseName} (${loaderName} ${minecraftVersions.join(' ')})")
                def boundary = "----ZMusicGradle${System.nanoTime()}"
                response = publishApiRequest(
                        'POST',
                        "${curseForgeApiBaseUrl.replaceAll('/+$', '')}/api/projects/${projectId}/upload-file",
                        [
                                'X-Api-Token' : token,
                                'Accept'      : 'application/json',
                                'Content-Type': "multipart/form-data; boundary=${boundary}"
                        ]
                ) { OutputStream out ->
                    writeMultipart(out, boundary, [metadata: metadataJson], file, 'file', fileName)
                }
                expectPublishStatus(response, [200])
                publishMarketplaceLog('CurseForge response:')
                println(prettyPublishJson(response.body))
            }
        } else if (publishCurseForge == 'false') {
            publishMarketplaceLog('Skipping CurseForge')
        } else {
            publishMarketplaceFail('PUBLISH_CURSEFORGE must be true or false')
        }
    }
}

tasks.register('publishReleaseMirrors') {
    group = 'publishing'
    description = 'Publishes or dry-runs the stable release artifacts on Codeberg and CNB.'

    doLast {
        def artifactsDirPath = requirePublishEnv('ARTIFACTS_DIR')
        def releaseTag = System.getenv('RELEASE_TAG') ?: requirePublishEnv('RELEASE_VERSION')
        def releaseName = System.getenv('RELEASE_NAME') ?: releaseTag
        def releaseBody = System.getenv('RELEASE_BODY') ?: ''
        def releaseDraft = System.getenv('RELEASE_DRAFT') ?: 'false'
        def releasePrerelease = System.getenv('RELEASE_PRERELEASE') ?: 'false'
        def releaseTargetCommitish = System.getenv('RELEASE_TARGET_COMMITISH') ?: ''
        def releaseMakeLatest = System.getenv('RELEASE_MAKE_LATEST') ?: ''
        def codebergApiBaseUrl = System.getenv('CODEBERG_API_BASE_URL') ?: 'https://codeberg.org/api/v1'
        def cnbApiBaseUrl = System.getenv('CNB_API_BASE_URL') ?: 'https://api.cnb.cool'
        def publishCodeberg = System.getenv('PUBLISH_CODEBERG') ?: 'true'
        def publishCnb = System.getenv('PUBLISH_CNB') ?: 'true'
        def dryRun = System.getenv('DRY_RUN') ?: 'false'

        if (!(dryRun in ['true', 'false'])) {
            publishMarketplaceFail('DRY_RUN must be true or false')
        }
        if (!(releaseDraft in ['true', 'false'])) {
            publishMarketplaceFail('RELEASE_DRAFT must be true or false')
        }
        if (!(releasePrerelease in ['true', 'false'])) {
            publishMarketplaceFail('RELEASE_PRERELEASE must be true or false')
        }

        def artifactsDir = new File(artifactsDirPath)
        if (!artifactsDir.isDirectory()) {
            publishMarketplaceFail("artifacts directory does not exist: ${artifactsDirPath}")
        }
        def artifactFiles = fileTree(artifactsDir) {
            include '**/*.jar'
        }.files.sort { it.name }
        if (artifactFiles.isEmpty()) {
            publishMarketplaceFail("no jar artifacts found in: ${artifactsDirPath}")
        }

        def releasePayload = [
                tag_name  : releaseTag,
                name      : releaseName,
                body      : releaseBody,
                draft     : releaseDraft == 'true',
                prerelease: releasePrerelease == 'true'
        ]
        def cnbCreatePayload = new LinkedHashMap(releasePayload)
        if (!releaseTargetCommitish.isBlank()) {
            cnbCreatePayload.target_commitish = releaseTargetCommitish
        }
        if (!releaseMakeLatest.isBlank()) {
            cnbCreatePayload.make_latest = releaseMakeLatest
        }
        def cnbUpdatePayload = [
                name      : releaseName,
                body      : releaseBody,
                draft     : releaseDraft == 'true',
                prerelease: releasePrerelease == 'true'
        ]
        if (!releaseMakeLatest.isBlank()) {
            cnbUpdatePayload.make_latest = releaseMakeLatest
        }

        publishMarketplaceLog("Release mirror artifacts: ${artifactFiles.size()}")
        artifactFiles.each {
            publishMarketplaceLog(" - ${it.name}")
        }
        def artifactFileNames = artifactFiles.collect { it.name } as Set

        if (publishCodeberg == 'true') {
            def codebergRepo = requirePublishRepoSlug(System.getenv('CODEBERG_REPO') ?: requirePublishEnv('GITHUB_REPOSITORY'))
            def owner = encodePublishUri(codebergRepo.substring(0, codebergRepo.indexOf('/')))
            def repo = encodePublishUri(codebergRepo.substring(codebergRepo.indexOf('/') + 1))
            def basePath = "/repos/${owner}/${repo}"

            if (dryRun == 'true') {
                publishMarketplaceLog("DRY_RUN Codeberg release ${releaseTag} in ${codebergRepo}:")
                println(prettyPublishJson(releasePayload))
            } else {
                def codebergToken = requirePublishEnv('CODEBERG_TOKEN')
                def headers = ['Authorization': "token ${codebergToken}", 'Accept': 'application/json']
                def enablePayloadJson = groovy.json.JsonOutput.toJson([has_releases: true])
                def response = publishApiRequest(
                        'PATCH',
                        "${codebergApiBaseUrl.replaceAll('/+$', '')}${basePath}",
                        headers + ['Content-Type': 'application/json']
                ) { OutputStream out ->
                    out.write(enablePayloadJson.getBytes('UTF-8'))
                }
                expectPublishStatus(response, [200])

                def tagPath = "${basePath}/releases/tags/${encodePublishUri(releaseTag)}"
                response = publishApiRequestWithoutBody('GET', "${codebergApiBaseUrl.replaceAll('/+$', '')}${tagPath}", headers)
                def releaseJson
                def payloadJson = groovy.json.JsonOutput.toJson(releasePayload)

                if (response.status == 404) {
                    response = publishApiRequest(
                            'POST',
                            "${codebergApiBaseUrl.replaceAll('/+$', '')}${basePath}/releases",
                            headers + ['Content-Type': 'application/json']
                    ) { OutputStream out ->
                        out.write(payloadJson.getBytes('UTF-8'))
                    }
                    expectPublishStatus(response, [201])
                    publishMarketplaceLog("Codeberg release created: ${releaseTag}")
                    releaseJson = new groovy.json.JsonSlurper().parseText(response.body)
                } else {
                    expectPublishStatus(response, [200])
                    releaseJson = new groovy.json.JsonSlurper().parseText(response.body)
                    response = publishApiRequest(
                            'PATCH',
                            "${codebergApiBaseUrl.replaceAll('/+$', '')}${basePath}/releases/${encodePublishUri(String.valueOf(releaseJson.id))}",
                            headers + ['Content-Type': 'application/json']
                    ) { OutputStream out ->
                        out.write(payloadJson.getBytes('UTF-8'))
                    }
                    expectPublishStatus(response, [200])
                    publishMarketplaceLog("Codeberg release updated: ${releaseTag}")
                    releaseJson = new groovy.json.JsonSlurper().parseText(response.body)
                }

                def releaseId = String.valueOf(releaseJson.id)
                response = publishApiRequestWithoutBody(
                        'GET',
                        "${codebergApiBaseUrl.replaceAll('/+$', '')}${basePath}/releases/${encodePublishUri(releaseId)}/assets",
                        headers
                )
                expectPublishStatus(response, [200])
                def assets = new groovy.json.JsonSlurper().parseText(response.body) as List
                assets.findAll { !artifactFileNames.contains(it.name) }.each { asset ->
                    publishMarketplaceLog("Deleting extra Codeberg asset: ${asset.name}")
                    response = publishApiRequestWithoutBody(
                            'DELETE',
                            "${codebergApiBaseUrl.replaceAll('/+$', '')}${basePath}/releases/${encodePublishUri(releaseId)}/assets/${encodePublishUri(String.valueOf(asset.id))}",
                            headers
                    )
                    expectPublishStatus(response, [204])
                }

                artifactFiles.each { file ->
                    def existing = assets.find { it.name == file.name }
                    if (existing != null) {
                        publishMarketplaceLog("Deleting existing Codeberg asset: ${file.name}")
                        response = publishApiRequestWithoutBody(
                                'DELETE',
                                "${codebergApiBaseUrl.replaceAll('/+$', '')}${basePath}/releases/${encodePublishUri(releaseId)}/assets/${encodePublishUri(String.valueOf(existing.id))}",
                                headers
                        )
                        expectPublishStatus(response, [204])
                    }

                    publishMarketplaceLog("Uploading Codeberg asset: ${file.name}")
                    def boundary = "----ZMusicGradle${System.nanoTime()}"
                    response = publishApiRequest(
                            'POST',
                            "${codebergApiBaseUrl.replaceAll('/+$', '')}${basePath}/releases/${encodePublishUri(releaseId)}/assets?name=${encodePublishUri(file.name)}",
                            headers + ['Content-Type': "multipart/form-data; boundary=${boundary}"]
                    ) { OutputStream out ->
                        writeFileOnlyMultipart(out, boundary, file, 'attachment', file.name)
                    }
                    expectPublishStatus(response, [201])
                }
            }
        } else if (publishCodeberg == 'false') {
            publishMarketplaceLog('Skipping Codeberg')
        } else {
            publishMarketplaceFail('PUBLISH_CODEBERG must be true or false')
        }

        if (publishCnb == 'true') {
            def cnbRepo = requirePublishRepoSlug(System.getenv('CNB_REPO') ?: requirePublishEnv('GITHUB_REPOSITORY'))
            def owner = encodePublishUri(cnbRepo.substring(0, cnbRepo.indexOf('/')))
            def repo = encodePublishUri(cnbRepo.substring(cnbRepo.indexOf('/') + 1))
            def repoPath = "/${owner}/${repo}"

            if (dryRun == 'true') {
                publishMarketplaceLog("DRY_RUN CNB release ${releaseTag} in ${cnbRepo}:")
                println(prettyPublishJson(cnbCreatePayload))
            } else {
                def cnbToken = requirePublishEnv('CNB_TOKEN')
                def headers = ['Authorization': "Bearer ${cnbToken}", 'Accept': 'application/vnd.cnb.api+json']
                def response = publishApiRequestWithoutBody(
                        'GET',
                        "${cnbApiBaseUrl.replaceAll('/+$', '')}${repoPath}/-/releases/tags/${encodePublishUri(releaseTag)}",
                        headers
                )
                def releaseJson
                if (response.status == 404) {
                    response = publishApiRequest(
                            'POST',
                            "${cnbApiBaseUrl.replaceAll('/+$', '')}${repoPath}/-/releases",
                            headers + ['Content-Type': 'application/json']
                    ) { OutputStream out ->
                        out.write(groovy.json.JsonOutput.toJson(cnbCreatePayload).getBytes('UTF-8'))
                    }
                    expectPublishStatus(response, [201])
                    publishMarketplaceLog("CNB release created: ${releaseTag}")
                    releaseJson = new groovy.json.JsonSlurper().parseText(response.body)
                } else {
                    expectPublishStatus(response, [200])
                    releaseJson = new groovy.json.JsonSlurper().parseText(response.body)
                    response = publishApiRequest(
                            'PATCH',
                            "${cnbApiBaseUrl.replaceAll('/+$', '')}${repoPath}/-/releases/${encodePublishUri(String.valueOf(releaseJson.id))}",
                            headers + ['Content-Type': 'application/json']
                    ) { OutputStream out ->
                        out.write(groovy.json.JsonOutput.toJson(cnbUpdatePayload).getBytes('UTF-8'))
                    }
                    expectPublishStatus(response, [200])
                    publishMarketplaceLog("CNB release updated: ${releaseTag}")
                    response = publishApiRequestWithoutBody(
                            'GET',
                            "${cnbApiBaseUrl.replaceAll('/+$', '')}${repoPath}/-/releases/${encodePublishUri(String.valueOf(releaseJson.id))}",
                            headers
                    )
                    expectPublishStatus(response, [200])
                    releaseJson = new groovy.json.JsonSlurper().parseText(response.body)
                }

                def releaseId = String.valueOf(releaseJson.id)
                (releaseJson.assets ?: []).findAll { !artifactFileNames.contains(it.name) }.each { asset ->
                    publishMarketplaceLog("Deleting extra CNB asset: ${asset.name}")
                    response = publishApiRequestWithoutBody(
                            'DELETE',
                            "${cnbApiBaseUrl.replaceAll('/+$', '')}${repoPath}/-/releases/${encodePublishUri(releaseId)}/assets/${encodePublishUri(String.valueOf(asset.id))}",
                            headers
                    )
                    expectPublishStatus(response, [200])
                }

                artifactFiles.each { file ->
                    def uploadPayload = [
                            asset_name: file.name,
                            overwrite : true,
                            size      : file.length(),
                            ttl       : 0
                    ]
                    response = publishApiRequest(
                            'POST',
                            "${cnbApiBaseUrl.replaceAll('/+$', '')}${repoPath}/-/releases/${encodePublishUri(releaseId)}/asset-upload-url",
                            headers + ['Content-Type': 'application/json']
                    ) { OutputStream out ->
                        out.write(groovy.json.JsonOutput.toJson(uploadPayload).getBytes('UTF-8'))
                    }
                    expectPublishStatus(response, [201])
                    def uploadJson = new groovy.json.JsonSlurper().parseText(response.body)
                    def uploadUrl = String.valueOf(uploadJson.upload_url ?: '')
                    def verifyUrl = String.valueOf(uploadJson.verify_url ?: '')
                    if (uploadUrl.isBlank() || verifyUrl.isBlank()) {
                        publishMarketplaceFail("CNB upload url response is incomplete: ${response.body ?: '<empty>'}")
                    }
                    if (!uploadUrl.startsWith('http://') && !uploadUrl.startsWith('https://')) {
                        uploadUrl = "${cnbApiBaseUrl.replaceAll('/+$', '')}${uploadUrl}"
                    }
                    if (!verifyUrl.startsWith('http://') && !verifyUrl.startsWith('https://')) {
                        verifyUrl = "${cnbApiBaseUrl.replaceAll('/+$', '')}${verifyUrl}"
                    }
                    verifyUrl = verifyUrl.contains('?') ? "${verifyUrl}&ttl=0" : "${verifyUrl}?ttl=0"

                    publishMarketplaceLog("Uploading CNB asset: ${file.name}")
                    def uploadConnection = (HttpURLConnection) new URL(uploadUrl).openConnection()
                    uploadConnection.requestMethod = 'PUT'
                    uploadConnection.doOutput = true
                    file.withInputStream { input ->
                        uploadConnection.outputStream.withCloseable { out ->
                            input.transferTo(out)
                        }
                    }
                    def uploadStatus = uploadConnection.responseCode
                    uploadConnection.disconnect()
                    if (!(uploadStatus in [200, 201, 204])) {
                        publishMarketplaceFail("unexpected CNB upload status: ${uploadStatus} for ${file.name}")
                    }

                    response = publishApiRequestWithoutBody('POST', verifyUrl, headers)
                    expectPublishStatus(response, [200])
                }
            }
        } else if (publishCnb == 'false') {
            publishMarketplaceLog('Skipping CNB')
        } else {
            publishMarketplaceFail('PUBLISH_CNB must be true or false')
        }
    }
}
