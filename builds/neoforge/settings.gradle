pluginManagement {
    repositories {
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "zmusic-neoforge"

include("zmusic-core")
project(":zmusic-core").projectDir = file("../../zmusic-core")

def neoforgeProjects = [
        "zmusic-neoforge-1.20.4",
        "zmusic-neoforge-1.20.6",
        "zmusic-neoforge-1.21.1",
        "zmusic-neoforge-26.1.2",
        "zmusic-neoforge-26.2"
]

def selectedProject = providers.gradleProperty("zmusic.project").orNull
def selectedProjects = selectedProject ? [selectedProject] : neoforgeProjects

selectedProjects.each { projectName ->
    if (!neoforgeProjects.contains(projectName)) {
        throw new GradleException("Unknown NeoForge project: ${projectName}")
    }
    include(projectName)
    project(":${projectName}").projectDir = file("../../zmusic-neoforge/${projectName}")
}
